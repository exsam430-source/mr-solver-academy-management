    <!-- ============================================
         INITIAL SPLASH SCREEN
         ============================================ -->
    <style>
      :root { color-scheme: dark; }

      html, body {
        margin: 0;
        padding: 0;
        background: #060e1e;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #initial-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(25, 86, 169, 0.4), transparent 60%),
                    radial-gradient(ellipse 70% 50% at 90% 100%, rgba(240, 110, 35, 0.25), transparent 60%),
                    #060e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 99999;
      }

      .splash-logo {
        width: 100px;
        height: 100px;
        border-radius: 24px;
        background: linear-gradient(135deg, #1956A9, #F06E23);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 20px 60px rgba(25, 86, 169, 0.4);
        animation: splash-pulse 2s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .splash-logo-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 36px;
        font-weight: 900;
        color: white;
      }

      .splash-title {
        font-size: 24px;
        font-weight: 800;
        color: white;
        margin: 0 0 8px 0;
      }

      .splash-subtitle {
        font-size: 12px;
        font-weight: 700;
        color: #F06E23;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin: 0 0 24px 0;
      }

      .splash-dots {
        display: flex;
        gap: 8px;
      }

      .splash-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1956A9, #F06E23);
        animation: splash-bounce 1.2s ease-in-out infinite;
      }

      .splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .splash-dot:nth-child(3) { animation-delay: 0.4s; }

      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); opacity: 0.5; }
        50% { transform: translateY(-12px); opacity: 1; }
      }

      #initial-splash.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease-out;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px; text-align: center; color: white; background: #060e1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div>
          <h1>⚠️ JavaScript Required</h1>
          <p>Please enable JavaScript to use Mr Solver Management System.</p>
        </div>
      </div>
    </noscript>

    <div id="root"></div>

    <!-- Splash Screen -->
    <div id="initial-splash">
      <div class="splash-logo">
        <span class="splash-logo-text">MS</span>
      </div>
      <h1 class="splash-title">Mr Solver Management</h1>
      <p class="splash-subtitle">✦ Academy System ✦</p>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('initial-splash');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 800);
      });
    </script>
  </body>
</html>
